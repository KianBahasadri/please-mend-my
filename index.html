<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#030303" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="description" content="please, mend my — finish the thought.">
    <title>please, mend my</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/backgrounds.css">
    <link rel="stylesheet" href="/assets/search.css">
    <link rel="stylesheet" href="/assets/hero-styles.css">
    <script src="/assets/hero-styles.js" defer></script>
    <script src="/assets/bicycle-art.js" defer></script>
    <script src="/assets/specifier-pilot.js" defer></script>
    <script src="/assets/specifiers.js" defer></script>
    <script src="/assets/hero.js" defer></script>
    <script src="/assets/search.js" defer></script>
    <script src="assets/backgrounds.js"></script>
    <script>
      const themes = ["pixel", "editorial", "comic", "poster", "typewriter", "handwritten", "toolbox",
        "stitched", "taped", "tooltype", "blueprint", "cutpaper"];
      const theme = window.pickMendVariant("please-mend-my-theme", themes);
      document.documentElement.dataset.theme = theme;
    </script>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        src: url("assets/fonts/pixelify-sans.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }

      @font-face {
        font-family: "Comic Neue";
        src: url("assets/fonts/comic-neue.woff2") format("woff2");
        font-weight: 700;
        font-display: swap;
      }

      @font-face {
        font-family: "Bungee";
        src: url("assets/fonts/bungee.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "Space Mono";
        src: url("assets/fonts/space-mono.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "Dancing Script";
        src: url("assets/fonts/dancing-script.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }

      :root {
        color-scheme: dark light;
        --paper: #030303;
        --ink: #fafafa;
        --font: "Times New Roman", "Liberation Serif", serif;
        --weight: 400;
        --tracking: -0.055em;
        --leading: 1.08;
        --size: clamp(3.5rem, 10.5vw, 10rem);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --paper: #fafafa;
          --ink: #111111;
        }
      }

      [data-theme="pixel"] {
        --font: "Pixelify Sans", monospace;
        --weight: 500;
        --tracking: -0.045em;
      }

      [data-theme="comic"] {
        --font: "Comic Sans MS", "Comic Sans", "Comic Neue", cursive;
        --weight: 700;
        --tracking: -0.06em;
        --leading: 1.16;
      }

      [data-theme="poster"] {
        --font: "Bungee", sans-serif;
        --tracking: -0.045em;
        --leading: 1.15;
        --size: clamp(3rem, 8.5vw, 8.5rem);
      }

      [data-theme="typewriter"] {
        --font: "Space Mono", monospace;
        --tracking: -0.07em;
        --leading: 1.2;
        --size: clamp(3rem, 8.5vw, 8.5rem);
      }

      [data-theme="handwritten"] {
        --font: "Dancing Script", cursive;
        --weight: 600;
        --tracking: -0.025em;
        --leading: 1.2;
        --size: clamp(4rem, 12vw, 11rem);
      }

      [data-theme="toolbox"] {
        --font: "Arial Rounded MT Bold", "Trebuchet MS", "DejaVu Sans", sans-serif;
        --weight: 700;
        --tracking: -0.065em;
        --leading: 1.2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(1.5rem, 6vw, 7rem);
      }

      h1 {
        position: relative;
        width: 100%;
        min-width: 0;
        max-width: 90rem;
        margin: 0 auto;
        font-family: var(--font);
        font-size: var(--size);
        font-weight: var(--weight);
        letter-spacing: var(--tracking);
        line-height: var(--leading);
        overflow-wrap: anywhere;
      }

      .hero-input {
        display: block;
        width: 100%;
        min-height: 1lh;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        outline: none;
        resize: none;
        overflow: hidden;
        background: transparent;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        caret-color: transparent;
      }

      .hero-input:focus {
        caret-color: currentColor;
      }

      .hero-field {
        position: relative;
        display: block;
        width: 100%;
      }

      .hero-underline {
        position: absolute;
        inset: 0;
        z-index: 1;
        color: transparent;
        -webkit-text-fill-color: transparent;
        font: inherit;
        letter-spacing: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        pointer-events: none;
        user-select: none;
      }

      #hero-prefix {
        visibility: hidden;
      }

      .hero-suffix,
      .floater-answer {
        text-decoration-line: underline;
        text-decoration-color: var(--ink);
        text-decoration-thickness: max(1px, 0.018em);
        text-underline-offset: 0.13em;
      }

      .hero-suffix.is-empty::after,
      .floater-answer:empty::after {
        content: "\00a0\00a0\00a0\00a0";
      }

      .clarification-question {
        display: block;
        margin-bottom: 0.12em;
        white-space: nowrap;
        user-select: none;
      }

      .clarification-line {
        display: grid;
        grid-template-rows: 0fr;
        margin-top: 0;
        opacity: 0;
        transform: translateY(-0.08em);
        transition: grid-template-rows 180ms ease, margin-top 180ms ease,
          opacity 180ms ease, transform 180ms ease;
      }

      .clarification-line.is-visible {
        grid-template-rows: 1fr;
        margin-top: 0.12em;
        opacity: 1;
        transform: translateY(0);
      }

      .clarification-content {
        display: block;
        min-height: 0;
        overflow: hidden;
      }

      #measure {
        position: absolute;
        top: 0;
        left: 0;
        visibility: hidden;
        white-space: pre;
        width: max-content;
        pointer-events: none;
      }

      ::selection {
        color: var(--paper);
        background: var(--ink);
      }

      .hero-area {
        position: relative;
      }

      .hero-floaters {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(100% + 0.4rem);
        height: clamp(5.5rem, 18vh, 12rem);
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        font-size: clamp(0.95rem, 1.7vw, 1.35rem);
      }

      .floater {
        position: absolute;
        left: var(--x);
        top: var(--y);
        color: var(--ink);
        white-space: nowrap;
        transform: translateX(-50%) rotate(var(--tilt));
      }

      .floater-drift {
        position: relative;
        display: inline-block;
        animation: floater-drift var(--drift) ease-in-out infinite alternate;
      }

      .floater-pop {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px) scale(0.2);
        transform-origin: center center;
      }

      .floater-prompt {
        opacity: 0.62;
      }

      .floater[data-style="editorial"] {
        font-family: "Times New Roman", "Liberation Serif", serif;
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      .floater[data-style="pixel"] {
        font-family: "Pixelify Sans", monospace;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .floater[data-style="comic"] {
        font-family: "Comic Sans MS", "Comic Sans", "Comic Neue", cursive;
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1.16;
      }

      .floater[data-style="poster"] {
        font-family: "Bungee", sans-serif;
        font-weight: 400;
        font-size: 0.74em;
        letter-spacing: -0.045em;
        line-height: 1.15;
      }

      .floater[data-style="typewriter"] {
        font-family: "Space Mono", monospace;
        font-weight: 400;
        font-size: 0.84em;
        letter-spacing: -0.07em;
        line-height: 1.2;
      }

      .floater[data-style="handwritten"] {
        font-family: "Dancing Script", cursive;
        font-weight: 600;
        font-size: 1.18em;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      .floater[data-style="toolbox"] {
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", "DejaVu Sans", sans-serif;
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 1.2;
      }

      .floater-bit {
        display: inline-block;
      }

      .floater-poof,
      .floater-spark {
        position: absolute;
        left: 50%;
        top: 42%;
        pointer-events: none;
      }

      .floater-poof {
        width: 1.15em;
        height: 1.15em;
        border: 1.5px solid currentColor;
        border-radius: 999px;
      }

      .floater[data-style="pixel"] .floater-poof,
      .floater[data-style="poster"] .floater-poof {
        border-radius: 2px;
      }

      .floater-spark {
        width: 5px;
        height: 5px;
        background: currentColor;
        border-radius: 999px;
      }

      .floater[data-style="pixel"] .floater-spark,
      .floater[data-style="poster"] .floater-spark {
        border-radius: 1px;
      }

      @keyframes floater-drift {
        from { transform: translate(calc(var(--sway) * -1), 7px); }
        to { transform: translate(var(--sway), -11px); }
      }

      @media (max-width: 640px) {
        .hero-floaters { font-size: 0.78rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-floaters { display: none; }
        .clarification-line { transition: none; }
      }

    </style>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main>
      <div class="search-shell">
        <section class="hero-area" aria-label="Search the repair library">
          <div class="hero-floaters" aria-hidden="true"></div>
          <h1>
            <span class="hero-field">
              <textarea id="response" class="hero-input" aria-label="please, mend my — what would you like to mend?" aria-controls="clarification-line" aria-expanded="false" spellcheck="false" rows="1" autofocus></textarea>
              <span class="hero-underline" aria-hidden="true" inert><span id="hero-prefix"></span><span id="hero-suffix" class="hero-suffix is-empty"></span></span>
            </span>
            <span id="clarification-line" class="clarification-line" aria-hidden="true" inert>
              <span class="clarification-content">
                <span id="clarification-question" class="clarification-question"></span>
                <span class="clarification-workspace">
                  <span class="hero-field">
                    <textarea id="clarification-response" class="hero-input" aria-label="What is wrong?" spellcheck="false" rows="1" tabindex="-1" disabled></textarea>
                    <span class="hero-underline" aria-hidden="true" inert><span id="clarification-underline" class="hero-suffix is-empty"></span></span>
                  </span>
                  <span id="topic-specifier" class="topic-specifier" hidden></span>
                </span>
              </span>
            </span>
            <span id="measure" aria-hidden="true"></span>
          </h1>
          <p id="catalog-status" class="catalog-status" role="status" hidden></p>
        </section>
        <section id="search-results" class="search-results" aria-label="Repair search results" hidden>
          <div id="result-cards" class="result-cards" role="list"></div>
          <div class="results-heading"><p id="result-count" aria-live="polite"></p></div>
        </section>
        <section id="guide-panel" class="guide-panel" aria-label="Repair guide" hidden>
          <button id="close-guide" class="text-button back-button" type="button">← Back to results</button>
          <div id="guide-body"></div>
        </section>
        <p id="guide-nav-error" class="guide-error" role="alert" hidden></p>
      </div>
    </main>
    <script>
      const response = document.getElementById("response");
      const prompt = theme === "toolbox" ? "🙏, 🔧 my " : "please, mend my ";
      response.value = prompt;
      response.dataset.promptLength = prompt.length;

      const floaterStage = document.querySelector(".hero-floaters");
      const floaterStyles = themes;
      const floaterWords = ["laptop", "stove", "kettle", "lamp", "bike", "radio", "toaster", "watch", "mixer", "boots", "camera", "phone", "jeans", "speaker", "blender", "clock", "chair", "iron"];
      const floaterMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let floaterGeneration = 0;
      let floatersReady = false;
      let floatersRunning = false;
      let styleBag = [];
      let wordBag = [];
      const activeFloaters = new Set();

      function shuffleBag(items) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swap = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swap]] = [copy[swap], copy[index]];
        }
        return copy;
      }

      function takeFrom(bag, source, used) {
        if (!bag.length) bag.push(...shuffleBag(source));
        const free = bag.findIndex((item) => !used.has(item));
        if (free === -1) return bag.pop();
        return bag.splice(free, 1)[0];
      }

      function floaterLimit() {
        return window.innerWidth < 720 ? 1 : 2;
      }

      function floaterIdle() {
        return floatersReady && response.value === prompt &&
          !document.body.classList.contains("searching") &&
          !document.body.classList.contains("reading") &&
          document.visibilityState !== "hidden" &&
          !floaterMotion.matches;
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function played(animation) {
        try {
          await animation.finished;
          return true;
        } catch {
          return false;
        }
      }

      function placeFloater() {
        const narrow = window.innerWidth < 640;
        for (let attempt = 0; attempt < 12; attempt += 1) {
          const x = (narrow ? 24 : 16) + Math.random() * (narrow ? 52 : 68);
          const y = 24 + Math.random() * 46;
          let clear = true;
          for (const other of activeFloaters) {
            if (Math.abs(x - other.x) < 36 && Math.abs(y - other.y) < 42) clear = false;
          }
          if (clear) return { x, y };
        }
        return null;
      }

      function burstFloater(drift, pop) {
        const text = [...pop.textContent];
        pop.textContent = "";
        const pieces = text.map((character, index) => {
          const bit = document.createElement("span");
          bit.className = "floater-bit";
          bit.textContent = character === " " ? "\u00a0" : character;
          pop.append(bit);
          const spread = (index - (text.length - 1) / 2) * 0.16;
          const angle = -Math.PI / 2 + spread + (Math.random() - 0.5) * 0.35;
          const distance = 22 + Math.random() * 28;
          const spin = (Math.random() - 0.5) * 64;
          return bit.animate([
            { transform: "translate(0, 0) rotate(0deg) scale(1)", opacity: 1 },
            { transform: `translate(${Math.cos(angle) * distance * 0.28}px, ${Math.sin(angle) * distance * 0.22}px) scale(1.12)`, opacity: 1, offset: 0.24 },
            { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance + 8}px) rotate(${spin}deg) scale(0.35)`, opacity: 0 },
          ], { duration: 1100, easing: "cubic-bezier(0.16, 0.72, 0.28, 1)", fill: "forwards" });
        });

        const poof = document.createElement("span");
        poof.className = "floater-poof";
        drift.append(poof);
        pieces.push(poof.animate([
          { transform: "translate(-50%, -50%) scale(0.25)", opacity: 0.75 },
          { transform: "translate(-50%, -50%) scale(2.5)", opacity: 0 },
        ], { duration: 980, easing: "cubic-bezier(0.16, 0.7, 0.3, 1)", fill: "forwards" }));

        for (let spark = 0; spark < 6; spark += 1) {
          const bit = document.createElement("span");
          bit.className = "floater-spark";
          const size = 3 + Math.random() * 4;
          bit.style.width = `${size}px`;
          bit.style.height = `${size}px`;
          drift.append(bit);
          const angle = Math.random() * Math.PI * 2;
          const distance = 14 + Math.random() * 28;
          pieces.push(bit.animate([
            { transform: "translate(-50%, -50%) scale(1)", opacity: 0.9 },
            { transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance - 6}px)) scale(0.2)`, opacity: 0 },
          ], { duration: 860 + Math.random() * 280, easing: "ease-out", fill: "forwards" }));
        }

        return Promise.all(pieces.map((animation) => played(animation)));
      }

      async function spawnFloater(generation) {
        const spot = placeFloater();
        if (!spot || generation !== floaterGeneration) return;
        const usedStyles = new Set([...activeFloaters].map((item) => item.style));
        const usedWords = new Set([...activeFloaters].map((item) => item.word));
        const style = takeFrom(styleBag, floaterStyles, usedStyles);
        const word = takeFrom(wordBag, floaterWords, usedWords);
        const tiltRange = style === "handwritten" || style === "comic" ? 8 : style === "poster" || style === "typewriter" ? 2.5 : 5;
        const floater = document.createElement("span");
        floater.className = "floater";
        floater.dataset.style = style;
        floater.style.setProperty("--x", `${spot.x}%`);
        floater.style.setProperty("--y", `${spot.y}%`);
        floater.style.setProperty("--tilt", `${(Math.random() * 2 - 1) * tiltRange}deg`);
        floater.style.setProperty("--drift", `${(5.2 + Math.random() * 2.6).toFixed(2)}s`);
        floater.style.setProperty("--sway", `${(5 + Math.random() * 6).toFixed(1)}px`);

        const drift = document.createElement("span");
        drift.className = "floater-drift";
        const pop = document.createElement("span");
        pop.className = "floater-pop";
        const promptText = document.createElement("span");
        promptText.className = "floater-prompt";
        promptText.textContent = window.mendHeroStyles.prompt(style);
        window.mendHeroStyles.decorateFloater(promptText, style);
        const answer = document.createElement("span");
        answer.className = "floater-answer";
        pop.append(promptText, answer);
        drift.append(pop);
        floater.append(drift);

        const record = { x: spot.x, y: spot.y, style, word, node: floater };
        activeFloaters.add(record);
        floaterStage.append(floater);
        const alive = () => floatersRunning && generation === floaterGeneration;

        try {
          if (!alive()) return;
          const popped = await played(pop.animate([
            { transform: "translateY(12px) scale(0.15)", opacity: 0 },
            { transform: "translateY(-3px) scale(1.14)", opacity: 1, offset: 0.62 },
            { transform: "translateY(1px) scale(0.96)", opacity: 1, offset: 0.82 },
            { transform: "translateY(0) scale(1)", opacity: 1 },
          ], { duration: 1100, easing: "linear", fill: "forwards" }));
          if (!popped || !alive()) return;

          for (const character of word) {
            answer.textContent += character;
            await wait(110 + Math.random() * 90);
            if (!alive()) return;
          }

          await wait(900 + Math.random() * 500);
          if (!alive()) return;
          const wound = await played(pop.animate([
            { transform: "translateY(0) scale(1)" },
            { transform: "translateY(1px) scale(0.84)", offset: 0.45 },
            { transform: "translateY(-3px) scale(1.28)" },
          ], { duration: 460, easing: "ease-out", fill: "forwards" }));
          if (!wound || !alive()) return;
          await burstFloater(drift, pop);
        } finally {
          activeFloaters.delete(record);
          floater.remove();
        }
      }

      async function floaterLoop(generation) {
        await wait(900);
        let shown = 0;
        while (floatersRunning && generation === floaterGeneration) {
          if (activeFloaters.size < floaterLimit()) {
            const before = activeFloaters.size;
            spawnFloater(generation);
            if (activeFloaters.size > before) shown += 1;
          }
          const gap = 3200 + Math.random() * 1800;
          await wait(shown >= 3 ? gap * 2 : gap);
        }
      }

      function startFloaters() {
        if (floatersRunning) return;
        floatersRunning = true;
        floaterLoop(floaterGeneration);
      }

      function stopFloaters() {
        if (!floatersRunning && activeFloaters.size === 0) return;
        floatersRunning = false;
        floaterGeneration += 1;
        for (const record of activeFloaters) record.node.remove();
        activeFloaters.clear();
      }

      function syncFloaters() {
        if (floaterIdle()) startFloaters();
        else stopFloaters();
      }

      new MutationObserver(syncFloaters).observe(document.body, { attributes: true, attributeFilter: ["class"] });
      document.addEventListener("visibilitychange", syncFloaters);
      floaterMotion.addEventListener("change", syncFloaters);
      response.addEventListener("input", syncFloaters);
      window.addEventListener("mend:querychange", syncFloaters);
      document.addEventListener("DOMContentLoaded", () => {
        if (!window.mendHeroStyles) return;
        document.fonts.ready.then(() => {
          floatersReady = true;
          syncFloaters();
        });
      });
    </script>
  </body>
</html>
