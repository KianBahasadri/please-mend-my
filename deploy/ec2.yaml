AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated Graviton4 host for please-mend-my's Go server.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing project SSH public key imported by ec2.sh.
  AdminCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    Description: Administrator IPv4 address, restricted to one /32.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: A zone offering c8g.xlarge, selected by ec2.sh.
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.73.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: 10.73.1.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and administrator-only SSH.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr}
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
  Server:
    Type: AWS::EC2::Instance
    DependsOn: [PublicRoute, SubnetRouteAssociation]
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: c8g.xlarge
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          install -d -o root -g root -m 0755 /opt/please-mend-my
          cat > /etc/systemd/system/please-mend-my.service <<'UNIT'
          [Unit]
          Description=please-mend-my Go HTTP server
          After=network-online.target
          Wants=network-online.target
          ConditionPathIsExecutable=/opt/please-mend-my/server

          [Service]
          Type=simple
          DynamicUser=yes
          User=please-mend-my
          WorkingDirectory=/opt/please-mend-my
          Environment=ADDR=:80
          ExecStart=/opt/please-mend-my/server
          Restart=on-failure
          RestartSec=2
          TimeoutStopSec=10
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          PrivateDevices=yes
          RestrictSUIDSGID=yes
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          UMask=0077
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable please-mend-my.service
  Address:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: please-mend-my}, {Key: Project, Value: please-mend-my}]
  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt Address.AllocationId
      InstanceId: !Ref Server

Outputs:
  PublicIp:
    Value: !Ref Address
  Url:
    Value: !Sub 'http://${Address}'
  InstanceId:
    Value: !Ref Server
